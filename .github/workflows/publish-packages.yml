name: Publish Packages

on:
  workflow_call:

env:
  DOTNET_VERSION: '10.0.x'
  VERSION_MAJOR: '1'
  VERSION_MINOR: '0'
  VERSION_PATCH: '0'

jobs:
  publish:
    name: Pack and Publish
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Calculate version
        id: version
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          BUILD_NUMBER=$(git rev-list --count develop)
          VERSION="${{ env.VERSION_MAJOR }}.${{ env.VERSION_MINOR }}.${{ env.VERSION_PATCH }}-alpha.$BUILD_NUMBER+$SHORT_SHA"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Pre-release version: $VERSION"

      - name: Pack packages using local feed
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "Building packages with version: $VERSION"
          
          # Create directories with absolute paths
          mkdir -p ./artifacts
          mkdir -p ./local-feed
          LOCAL_FEED_PATH="$(pwd)/local-feed"
          
          # Add local feed as a NuGet source with absolute path
          dotnet nuget add source "$LOCAL_FEED_PATH" --name LocalFeed
          echo "Local feed path: $LOCAL_FEED_PATH"
          
          # Define projects in dependency order
          PROJECTS=(
            "src/shared/CascadeEsdm.SharedKernel.Abstractions/CascadeEsdm.SharedKernel.Abstractions.csproj"
            "src/shared/CascadeEsdm.SharedKernel/CascadeEsdm.SharedKernel.csproj"
            "src/write/CascadeEsdm.WriteModel.Abstractions/CascadeEsdm.WriteModel.Abstractions.csproj"
            "src/write/CascadeEsdm.WriteModel/CascadeEsdm.WriteModel.csproj"
            "src/read/CascadeEsdm.ReadModel.Abstractions/CascadeEsdm.ReadModel.Abstractions.csproj"
            "src/read/CascadeEsdm.ReadModel/CascadeEsdm.ReadModel.csproj"
            "src/tools/CascadeEsdm.EventExtractor/CascadeEsdm.EventExtractor.csproj"
            "src/tools/CascadeEsdm.AIContext/CascadeEsdm.AIContext.csproj"
          )
          
          # Pack each project and add to local feed
          for PROJECT in "${PROJECTS[@]}"; do
            PROJECT_NAME=$(basename "$PROJECT" .csproj)
            echo ""
            echo "📦 Packing $PROJECT_NAME..."
            
            dotnet pack "$PROJECT" \
              --configuration Release \
              --output ./artifacts \
              /p:Version="$VERSION" \
              /p:UseProjectReferences=false \
              /p:CascadeVersion="$VERSION"
            
            if [ $? -ne 0 ]; then
              echo "❌ Failed to pack $PROJECT_NAME"
              exit 1
            fi
            
            # Copy to local feed so next packages can reference it
            cp ./artifacts/*.nupkg ./local-feed/ 2>/dev/null || true
            
            echo "✅ $PROJECT_NAME packed successfully"
          done
          
          echo ""
          echo "✅ All packages built successfully"
          ls -lh ./artifacts/

      - name: Push packages to NuGet
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "⚠️ NUGET_API_KEY secret is not set. Skipping NuGet push."
            echo "To publish packages, add your NuGet API key as a repository secret named NUGET_API_KEY"
            exit 0
          fi
          
          echo "📤 Pushing all packages to NuGet.org..."
          dotnet nuget push ./artifacts/*.nupkg \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
          
          echo "✅ All packages published successfully"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages-prerelease
          path: ./artifacts/*.nupkg
          retention-days: 30
