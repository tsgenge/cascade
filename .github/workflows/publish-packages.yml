name: Publish Packages

on:
  workflow_call:
    inputs:
      is-prerelease:
        required: true
        type: boolean
        description: 'Whether this is a pre-release build'

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  publish:
    name: Pack and Publish
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Calculate version (Pre-release)
        if: inputs.is-prerelease
        id: version-prerelease
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          BUILD_NUMBER=$(git rev-list --count develop)
          VERSION="1.0.0-beta.$BUILD_NUMBER+$SHORT_SHA"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Pre-release version: $VERSION"

      - name: Calculate version (Release)
        if: ${{ !inputs.is-prerelease }}
        id: version-release
        run: |
          if git describe --tags --exact-match 2>/dev/null; then
            VERSION=$(git describe --tags --exact-match | sed 's/^v//')
          else
            BUILD_NUMBER=$(git rev-list --count master)
            VERSION="1.0.$BUILD_NUMBER"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Release version: $VERSION"

      - name: Set version output
        id: version
        run: |
          if [ "${{ inputs.is-prerelease }}" == "true" ]; then
            echo "version=${{ steps.version-prerelease.outputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${{ steps.version-release.outputs.version }}" >> $GITHUB_OUTPUT
          fi

      - name: Pack packages using local feed
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "Building packages with version: $VERSION"
          
          # Create directories
          mkdir -p ./artifacts
          mkdir -p ./local-feed
          
          # Add local feed as a NuGet source
          dotnet nuget add source ./local-feed --name LocalFeed
          
          # Define projects in dependency order
          PROJECTS=(
            "src/shared/Cascade.SharedKernel.Abstractions/Cascade.SharedKernel.Abstractions.csproj"
            "src/shared/Cascade.SharedKernel/Cascade.SharedKernel.csproj"
            "src/commands/Cascade.Commands.Abstractions/Cascade.Commands.Abstractions.csproj"
            "src/commands/Cascade.Commands/Cascade.Commands.csproj"
            "src/queries/Cascade.Views.Abstractions/Cascade.Views.Abstractions.csproj"
            "src/queries/Cascade.Views/Cascade.Views.csproj"
          )
          
          # Pack each project and add to local feed
          for PROJECT in "${PROJECTS[@]}"; do
            PROJECT_NAME=$(basename "$PROJECT" .csproj)
            echo ""
            echo "📦 Packing $PROJECT_NAME..."
            
            dotnet pack "$PROJECT" \
              --configuration Release \
              --output ./artifacts \
              /p:Version="$VERSION" \
              /p:UseProjectReferences=false \
              /p:CascadeVersion="$VERSION"
            
            if [ $? -ne 0 ]; then
              echo "❌ Failed to pack $PROJECT_NAME"
              exit 1
            fi
            
            # Copy to local feed so next packages can reference it
            cp ./artifacts/*.nupkg ./local-feed/ 2>/dev/null || true
            
            echo "✅ $PROJECT_NAME packed successfully"
          done
          
          echo ""
          echo "✅ All packages built successfully"
          ls -lh ./artifacts/

      - name: Push packages to NuGet
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "⚠️ NUGET_API_KEY secret is not set. Skipping NuGet push."
            echo "To publish packages, add your NuGet API key as a repository secret named NUGET_API_KEY"
            exit 0
          fi
          
          echo "📤 Pushing all packages to NuGet.org..."
          dotnet nuget push ./artifacts/*.nupkg \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
          
          echo "✅ All packages published successfully"

      - name: Create GitHub Release
        if: ${{ !inputs.is-prerelease && startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v1
        with:
          files: ./artifacts/*.nupkg
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages-${{ inputs.is-prerelease && 'prerelease' || 'release' }}
          path: ./artifacts/*.nupkg
          retention-days: 30
