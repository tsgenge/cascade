name: Pack Projects Template

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
        description: 'Version to use for the packages'
      configuration:
        required: false
        type: string
        default: 'Release'
        description: 'Build configuration'
    outputs:
      artifacts-path:
        description: 'Path to the packed artifacts'
        value: './artifacts'

jobs:
  pack:
    runs-on: ubuntu-latest
    
    steps:
      - name: Pack SharedKernel.Abstractions
        run: |
          dotnet pack src/shared/Cascade.SharedKernel.Abstractions/Cascade.SharedKernel.Abstractions.csproj \
            --configuration ${{ inputs.configuration }} \
            --output ./artifacts \
            /p:Version=${{ inputs.version }} \
            /p:UseProjectReferences=false \
            /p:CascadeVersion=${{ inputs.version }}

      - name: Pack SharedKernel
        run: |
          dotnet pack src/shared/Cascade.SharedKernel/Cascade.SharedKernel.csproj \
            --configuration ${{ inputs.configuration }} \
            --output ./artifacts \
            /p:Version=${{ inputs.version }} \
            /p:UseProjectReferences=false \
            /p:CascadeVersion=${{ inputs.version }}

      - name: Pack Commands.Abstractions
        run: |
          dotnet pack src/commands/Cascade.Commands.Abstractions/Cascade.Commands.Abstractions.csproj \
            --configuration ${{ inputs.configuration }} \
            --output ./artifacts \
            /p:Version=${{ inputs.version }} \
            /p:UseProjectReferences=false \
            /p:CascadeVersion=${{ inputs.version }}

      - name: Pack Commands
        run: |
          dotnet pack src/commands/Cascade.Commands/Cascade.Commands.csproj \
            --configuration ${{ inputs.configuration }} \
            --output ./artifacts \
            /p:Version=${{ inputs.version }} \
            /p:UseProjectReferences=false \
            /p:CascadeVersion=${{ inputs.version }}

      - name: Pack Views.Abstractions
        run: |
          dotnet pack src/queries/Cascade.Views.Abstractions/Cascade.Views.Abstractions.csproj \
            --configuration ${{ inputs.configuration }} \
            --output ./artifacts \
            /p:Version=${{ inputs.version }} \
            /p:UseProjectReferences=false \
            /p:CascadeVersion=${{ inputs.version }}

      - name: Pack Views
        run: |
          dotnet pack src/queries/Cascade.Views/Cascade.Views.csproj \
            --configuration ${{ inputs.configuration }} \
            --output ./artifacts \
            /p:Version=${{ inputs.version }} \
            /p:UseProjectReferences=false \
            /p:CascadeVersion=${{ inputs.version }}
